<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKE Auth</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #222;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #333;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
        }
        h1 { margin-top: 0; color: #5181b8; }
        p { color: #aaa; line-height: 1.5; }
        button {
            background: #5181b8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        button:hover { background: #4a76a8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { margin-top: 20px; font-weight: bold; }
        .success { color: #4bb34b; }
        .error { color: #e64646; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VKE Enhanced</h1>
        <p id="desc">Для работы функции «Удалённые сообщения» и «Бомбочки» расширению нужен доступ к API ВКонтакте.</p>
        <p>Нажмите кнопку ниже, чтобы авторизоваться. Это безопасно — мы не сохраняем ваш пароль, только временный токен сессии.</p>
        <button id="authBtn" onclick="startAuth()">Авторизоваться</button>
        <div id="status" class="status"></div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
