<script>
    const APP_ID = 6287487;
    // ВАЖНО: Этот ID должен быть ровно 32 символа. 
    // Проверьте его на странице chrome://extensions (в режиме разработчика)
    const EXTENSION_ID = 'iibcggkfomjepkmpdeeaoljebfbjeacf'; 

    async function startAuth() {
        const btn = document.getElementById('authBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Пробуждение расширения...';
        status.innerText = '';
        status.className = 'status';

        if (typeof chrome === 'undefined' || !chrome.runtime) {
            showError('API расширений недоступно.');
            return;
        }

        try {
            // 1. ПЫТАЕМСЯ РАЗБУДИТЬ SERVICE WORKER
            // Отправляем пустое сообщение. Если SW спит, Chrome его запустит.
            await new Promise((resolve, reject) => {
                chrome.runtime.sendMessage(EXTENSION_ID, { type: 'VKE_PING' }, (response) => {
                    if (chrome.runtime.lastError) {
                        // Ошибка соединения - SW мертв или заблокирован
                        reject(new Error(chrome.runtime.lastError.message));
                    } else {
                        resolve(response);
                    }
                });
            });

            btn.innerHTML = '<span class="loader"></span> Получение токена VK...';

            // 2. ПОЛУЧАЕМ ТОКЕН
            const response = await fetch(`https://login.vk.com/?act=web_token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ version: '1', app_id: APP_ID, access_token: '' }),
                credentials: 'include'
            });

            const data = await response.json();

            if (data.type === 'okay' && data.data) {
                const tokenData = Array.isArray(data.data) ? data.data[0] : data.data;
                const token = tokenData.access_token;
                
                if (!token) throw new Error('Токен пустой');

                // 3. ОТПРАВЛЯЕМ ТОКЕН (SW уже бодрствует после пинга)
                chrome.runtime.sendMessage(EXTENSION_ID, { 
                    type: 'VKE_AUTH_REQUEST', 
                    payload: { token: token, userId: tokenData.user_id } 
                }, (bgResponse) => {
                    if (chrome.runtime.lastError) {
                        showError('Ошибка связи: ' + chrome.runtime.lastError.message);
                        return;
                    }
                    
                    if (bgResponse && bgResponse.status === 'ok') {
                        status.innerText = '✅ Успешно! Токен передан.';
                        status.className = 'status success';
                        btn.style.display = 'none';
                    } else {
                        showError('Расширение вернуло ошибку');
                    }
                });
            } else {
                throw new Error(data.error_info || 'Ошибка VK API');
            }
        } catch (e) {
            console.error(e);
            showError(e.message);
        }
    }

    function showError(msg) {
        const status = document.getElementById('status');
        const btn = document.getElementById('authBtn');
        status.innerText = '❌ ' + msg;
        status.className = 'status error';
        btn.disabled = false;
        btn.innerText = 'Попробовать снова';
    }
</script>
