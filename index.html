<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKE Auth Bridge</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #19191a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #2d2d2f; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 400px; width: 90%; }
        h1 { margin-top: 0; color: #5181b8; font-size: 24px; }
        p { color: #aaa; line-height: 1.6; font-size: 14px; margin-bottom: 24px; }
        button { background: #5181b8; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.2s; width: 100%; }
        button:hover { background: #4a76a8; transform: translateY(-1px); }
        button:disabled { background: #444; cursor: not-allowed; transform: none; opacity: 0.7; }
        .status { margin-top: 20px; font-size: 14px; min-height: 20px; word-break: break-word; }
        .success { color: #4bb34b; }
        .error { color: #e64646; }
        .loader { display: inline-block; width: 20px; height: 20px; border: 2px solid #5181b8; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>VKE Enhanced Auth</h1>
        <p>Эта страница служит мостом для безопасной передачи токена ВКонтакте в расширение.</p>
        <button id="authBtn" onclick="startAuth()">Авторизоваться</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        const APP_ID = 6287487;
        const EXTENSION_ID = 'iibcggkfomjepkmpdeeaoljebfbjeacf'; // Замените на реальный ID вашего расширения из chrome://extensions

        async function startAuth() {
            const btn = document.getElementById('authBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> Проверка связи...';
            status.innerText = '';
            status.className = 'status';

            try {
                // 1. Проверяем, установлено ли расширение и активно ли оно
                const isConnected = await checkExtensionConnection();
                if (!isConnected) {
                    throw new Error('Расширение не найдено или не отвечает. Убедитесь, что оно включено.');
                }

                // 2. Получаем токен от VK
                btn.innerHTML = '<span class="loader"></span> Получение токена...';
                const response = await fetch(`https://login.vk.com/?act=web_token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ version: '1', app_id: APP_ID, access_token: '' }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.type === 'okay' && data.data) {
                    const tokenData = Array.isArray(data.data) ? data.data[0] : data.data;
                    const token = tokenData.access_token;
                    
                    if (!token) throw new Error('Токен пустой');

                    // 3. Отправляем токен в расширение
                    window.postMessage({ 
                        type: 'VKE_AUTH_REQUEST', 
                        payload: { token: token, userId: tokenData.user_id } 
                    }, '*');

                    // 4. Ждем подтверждения с увеличенным таймаутом (10 сек)
                    const bridgeResponse = await new Promise((resolve) => {
                        const handler = (event) => {
                            if (event.source !== window) return;
                            if (event.data && event.data.type === 'VKE_AUTH_RESPONSE') {
                                window.removeEventListener('message', handler);
                                resolve(event.data);
                            }
                        };
                        window.addEventListener('message', handler);
                        setTimeout(() => {
                            window.removeEventListener('message', handler);
                            resolve({ error: 'Timeout: Расширение не подтвердило получение токена за 10 сек' });
                        }, 10000);
                    });

                    if (bridgeResponse.error) throw new Error(bridgeResponse.error);

                    status.innerText = '✅ Успешно! Токен передан.';
                    status.className = 'status success';
                    btn.style.display = 'none';
                    
                } else {
                    throw new Error(data.error_info || 'Ошибка VK API');
                }
            } catch (e) {
                console.error(e);
                status.innerText = ' Ошибка: ' + e.message;
                status.className = 'status error';
                btn.disabled = false;
                btn.innerText = 'Попробовать снова';
            }
        }

        // Функция проверки связи с расширением
        function checkExtensionConnection() {
            return new Promise((resolve) => {
                let resolved = false;
                
                const handler = (event) => {
                    if (event.source !== window) return;
                    if (event.data && event.data.type === 'VKE_PING_RESPONSE') {
                        if (!resolved) {
                            resolved = true;
                            window.removeEventListener('message', handler);
                            resolve(true);
                        }
                    }
                };
                
                window.addEventListener('message', handler);
                
                // Отправляем ping
                window.postMessage({ type: 'VKE_PING' }, '*');
                
                // Таймаут на проверку связи (3 сек)
                setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        window.removeEventListener('message', handler);
                        resolve(false);
                    }
                }, 3000);
            });
        }
    </script>
</body>
</html>
